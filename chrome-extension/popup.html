<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
body{width:420px;margin:0;background:#0B0D12;color:#E6E8EE;font-family:Inter,Segoe UI,sans-serif;padding:14px}
h1{font-size:15px;margin:0 0 4px}.muted{color:#8A93A6;font-size:12px;margin:0 0 10px}
textarea{width:100%;box-sizing:border-box;height:220px;background:#12151C;color:#E6E8EE;border:1px solid #232836;border-radius:6px;padding:8px;font-family:Consolas,monospace;font-size:12px;resize:vertical}
button{margin-top:10px;width:100%;background:#4F8CFF;color:#fff;border:0;border-radius:6px;padding:9px;font-weight:600;cursor:pointer}
.tip{margin-top:10px;font-size:11px;color:#8A93A6}
</style></head><body>
<h1>◆ Code Doctor</h1>
<p class="muted">Will your code survive scale? Paste Python code below.</p>
<textarea id="code" placeholder="def get_dashboard(db, users, orders): ..."></textarea>
<button id="go">Analyze →</button>
<div class="tip">Tip: select code on any web page → right-click → <b>Analyze with Code Doctor</b>.</div>
<script src="popup.js"></script>
</body></html>
